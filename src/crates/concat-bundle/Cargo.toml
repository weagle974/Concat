[package]
name = "concat-bundle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "A project as one file: the edit and every file it uses, packed to move to another phone or to survive a reinstall, and unpacked into a project folder."

[dependencies]
serde_json.workspace = true
thiserror.workspace = true
# Only the zip format itself, with deflate for the small text files. The
# media are stored as they are: a video is already as small as it gets.
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
