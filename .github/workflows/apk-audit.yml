name: APK audit

# Reads, never runs, the Android APK a "Build for phones" run produced, and
# commits a Markdown report to the apk-audit-report branch
# (audit-apk/REPORT.md).
#
# Starts by itself when a "Build for phones" run finishes well, or by hand
# (optionally with the run id to audit; the latest good run otherwise).
on:
  workflow_run:
    workflows: ["Build for phones"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: The "Build for phones" run whose Concat-android-arm64 artifact to audit (empty = the latest good run)
        required: false
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  audit:
    # A build that failed has no APK to read.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Find the run to audit
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          GIVEN: ${{ inputs.run_id || github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ -z "$GIVEN" ]; then
            GIVEN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "Build for phones" \
              --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          [ -n "$GIVEN" ] || { echo "no good Build for phones run found"; exit 1; }
          echo "Auditing the artifact of run $GIVEN"
          echo "id=$GIVEN" >> "$GITHUB_OUTPUT"
      - name: Download the APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/apk_dl
          gh run download "${{ steps.run.outputs.id }}" --repo "$GITHUB_REPOSITORY" --name Concat-android-arm64 --dir /tmp/apk_dl
          find /tmp/apk_dl -type f | sort
      - name: Audit
        run: |
          set -euo pipefail
          apk=$(find /tmp/apk_dl -name '*.apk' | head -1)
          [ -n "$apk" ] || { echo "no APK in the artifact"; exit 1; }
          mkdir -p audit-apk
          python3 .github/scripts/audit_apk.py "$apk" src/Cargo.lock audit-apk/REPORT.md
          {
            echo
            echo "Audited run: ${{ steps.run.outputs.id }}  source commit: $(git rev-parse --short HEAD)"
          } >> audit-apk/REPORT.md
          wc -c audit-apk/REPORT.md
      - name: Commit the report to the apk-audit-report branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B apk-audit-report
          git add audit-apk/REPORT.md
          git commit -m "APK audit report for run ${{ steps.run.outputs.id }} [skip ci]"
          git push --force origin apk-audit-report
